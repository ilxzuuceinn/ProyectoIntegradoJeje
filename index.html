
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Inicio - WindForce</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js" defer></script>
</head>
<body>

    <nav class="barra">
        <div class="contenedor">
            <a class="marca" href="#">
                <img src="img/wind.png" alt="Logo" width="30" height="24" class="imagenLogo">
                WindForce
            </a>
            <div class="enlaces">
                <a href="#" onclick="mostrarInicioSesion()">Iniciar Sesión</a>
                <a href="#" onclick="mostrarRegistro()">Registrarse</a>
            </div>
        </div>
    </nav>

    <div class="principal">
        
        
        <div id="DivRegistro" class="registro">
            <h1>Crear cuenta</h1>
            <p>Cree su cuenta para guardar sus datos</p>
            <div class="formulario">
                <input type="text" id="nuevoUsuario" placeholder="Crear usuario">
                <br>
                <input type="password" id="nuevaContrasena" placeholder="Crear contraseña">
                <br>
                <button onclick="registrar()">Registrarse</button>
            </div>
            <p id="mensaje1"></p>
        </div>

       
        <div id="DivInicioSesion" class="inicio">
            <h1>Inicio de Sesión</h1>
            <p>Ingrese su usuario y contraseña para poder continuar</p>
            <div class="formulario">
                <input type="text" id="usuario" placeholder="Nombre de usuario">
                <br>
                <input type="password" id="contrasena" placeholder="Contraseña">
                <br>
                <button onclick="iniciarSesion()">Inicio de Sesión</button>
            </div>
            <p id="mensaje2"></p>
        </div>

    </div>

</body>
</html>
